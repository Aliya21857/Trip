<!doctype html>
<html lang="de">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#7fc7f7">
  <title>🌍 Where are you from?</title>
  <style>
    :root {
      --blue: #4e9fec;
      --teal: #3bc8c0;
      --ink: #153b5b;
      --muted: #637c91;
      --white: #fff;
      --green: #25b96d;
      --green2: #e2f9ec;
      --red: #ed6470;
      --red2: #fff0f1;
      --yellow: #ffc744;
      --shadow: 0 20px 55px rgba(28, 83, 122, .18);
      --radius: 28px
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      min-height: 100%;
      margin: 0
    }

    body {
      font-family: var(--font-ui, "DM Sans", "Segoe UI", Arial, sans-serif);
      color: var(--ink);
      overflow-x: hidden;
      background: linear-gradient(145deg, #dff8ff 0%, #c8f5ed 48%, #ecfbff 100%)
    }

    button {
      font: inherit
    }

    button:focus-visible,
    a:focus-visible {
      outline: 4px solid #164e78;
      outline-offset: 3px
    }

    .bg {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: -1
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, .27);
      animation: float 7s ease-in-out infinite
    }

    .o1 {
      width: 180px;
      height: 180px;
      left: -55px;
      top: 22%
    }

    .o2 {
      width: 110px;
      height: 110px;
      right: 4%;
      top: 8%;
      animation-delay: -3s
    }

    .o3 {
      width: 260px;
      height: 260px;
      right: -100px;
      bottom: -70px
    }

    .cloud {
      position: absolute;
      width: 110px;
      height: 35px;
      border-radius: 40px;
      background: rgba(255, 255, 255, .55);
      animation: cloud 18s linear infinite
    }

    .cloud:before,
    .cloud:after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: inherit
    }

    .cloud:before {
      width: 48px;
      height: 48px;
      left: 18px;
      bottom: 7px
    }

    .cloud:after {
      width: 59px;
      height: 59px;
      right: 12px;
      bottom: 4px
    }

    .c1 {
      top: 12%;
      left: -140px
    }

    .c2 {
      top: 62%;
      left: -190px;
      animation-duration: 27s;
      animation-delay: -8s;
      transform: scale(.75)
    }

    .route {
      position: absolute;
      width: 360px;
      height: 160px;
      right: 4%;
      bottom: 8%;
      opacity: .25
    }

    .plane {
      position: absolute;
      font-size: 35px;
      top: 22%;
      left: 14%;
      animation: plane 10s ease-in-out infinite
    }

    .map {
      position: absolute;
      inset: 5% 8%;
      opacity: .07;
      background: radial-gradient(ellipse at 20% 30%, #075f7f 0 8%, transparent 8.5%), radial-gradient(ellipse at 45% 38%, #075f7f 0 12%, transparent 12.5%), radial-gradient(ellipse at 72% 48%, #075f7f 0 13%, transparent 13.5%), radial-gradient(ellipse at 55% 72%, #075f7f 0 8%, transparent 8.5%)
    }

    .app {
      min-height: 100vh;
      min-height: 100dvh;
      padding: max(14px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center
    }

    .topbar {
      width: min(880px, 100%);
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      min-height: 45px
    }

    .progress-info {
      font-weight: 800
    }

    .score {
      background: rgba(255, 255, 255, .72);
      padding: 9px 13px;
      border-radius: 16px;
      font-weight: 900;
      white-space: nowrap
    }

    .icon-btn {
      border: 0;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: rgba(255, 255, 255, .8);
      box-shadow: 0 5px 16px rgba(25, 72, 104, .12);
      cursor: pointer;
      font-size: 20px
    }

    .progress-track {
      width: min(880px, 100%);
      height: 11px;
      background: rgba(255, 255, 255, .55);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 18px
    }

    .progress-fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--yellow), #ff9b48);
      border-radius: inherit;
      transition: width .45s ease
    }

    .screen {
      width: min(880px, 100%);
      margin: auto;
      animation: enter .45s ease both
    }

    .glass {
      background: rgba(255, 255, 255, .9);
      border: 1px solid rgba(255, 255, 255, .85);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      backdrop-filter: blur(12px)
    }

    .start,
    .end {
      padding: clamp(25px, 6vw, 58px);
      text-align: center;
      position: relative;
      overflow: hidden
    }

    .hero-globe {
      font-size: clamp(68px, 14vw, 120px);
      display: block;
      filter: drop-shadow(0 12px 16px rgba(30, 116, 149, .2));
      animation: float 4s ease-in-out infinite
    }

    .start h1,
    .end h1 {
      font-size: clamp(32px, 7vw, 60px);
      line-height: 1.08;
      margin: 14px 0 8px
    }

    .subtitle {
      font-size: clamp(19px, 3vw, 27px);
      font-weight: 800;
      color: #287ba0;
      margin: 0 0 25px
    }

    .instruction {
      font-size: 18px;
      line-height: 1.6;
      margin: 0 0 25px;
      color: var(--muted)
    }

    .instruction strong {
      display: block;
      color: var(--ink)
    }

    .btn {
      border: 0;
      border-radius: 18px;
      padding: 15px 24px;
      font-weight: 900;
      cursor: pointer;
      transition: transform .16s, box-shadow .16s, background .16s;
      min-height: 54px
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-2px)
    }

    .btn:active:not(:disabled) {
      transform: translateY(1px)
    }

    .primary {
      background: linear-gradient(135deg, #22bda7, #269adc);
      color: #fff;
      box-shadow: 0 10px 25px rgba(30, 157, 179, .3);
      font-size: 20px
    }

    .secondary {
      background: #eaf4f8;
      color: var(--ink)
    }

    .start-actions,
    .end-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: min(380px, 100%);
      margin: auto
    }

    .back-link {
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .game-card {
      padding: clamp(20px, 4vw, 40px);
      position: relative
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      min-height: 35px
    }

    .hearts {
      font-size: 22px;
      letter-spacing: 3px
    }

    .practice {
      font-weight: 900;
      color: #2877a5
    }

    .combo {
      font-weight: 900;
      color: #d57800;
      background: #fff3c9;
      border-radius: 13px;
      padding: 6px 10px;
      animation: pop .35s ease
    }

    .question-head {
      text-align: center
    }

    .character {
      font-size: 18px;
      font-weight: 900;
      color: #397495;
      margin-bottom: 8px
    }

    .flag {
      font-size: clamp(57px, 10vw, 82px);
      line-height: 1.15;
      filter: drop-shadow(0 7px 7px rgba(32, 61, 74, .13))
    }

    .country {
      font-weight: 900;
      font-size: 20px;
      margin-top: 4px
    }

    .prompt {
      font-size: clamp(22px, 4vw, 30px);
      line-height: 1.3;
      margin: 17px 0 22px
    }

    .blank {
      display: inline-block;
      min-width: 80px;
      border-bottom: 4px solid var(--teal);
      color: #217c8a
    }

    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px
    }

    .choice {
      border: 2px solid #dcecf1;
      background: #fff;
      color: var(--ink);
      border-radius: 17px;
      padding: 15px;
      min-height: 62px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(36, 89, 118, .07);
      transition: .17s
    }

    .choice:hover:not(:disabled) {
      border-color: #5bc7d0;
      transform: translateY(-2px)
    }

    .choice.correct,
    .word.correct {
      background: var(--green2);
      border-color: var(--green);
      color: #08713c;
      box-shadow: 0 0 0 5px rgba(37, 185, 109, .1)
    }

    .choice.wrong,
    .word.wrong {
      background: var(--red2);
      border-color: var(--red);
      color: #a72c38;
      box-shadow: 0 0 0 5px rgba(237, 100, 112, .1);
      animation: shake .35s ease
    }

    .choice:disabled {
      cursor: default
    }

    .num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 25px;
      height: 25px;
      border-radius: 8px;
      background: #edf4f7;
      margin-right: 7px;
      color: #507086;
      font-size: 13px
    }

    .builder-answer {
      min-height: 78px;
      border: 2px dashed #9ecfd5;
      border-radius: 18px;
      padding: 11px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 15px;
      background: #f5fcfc
    }

    .placeholder {
      color: #8098a6;
      margin: auto
    }

    .word-bank {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      min-height: 62px
    }

    .word {
      border: 2px solid #cde6eb;
      background: #fff;
      border-radius: 14px;
      padding: 11px 15px;
      font-weight: 900;
      color: var(--ink);
      cursor: pointer;
      box-shadow: 0 5px 12px rgba(20, 72, 99, .08);
      transition: .17s
    }

    .word:hover {
      transform: translateY(-2px);
      border-color: var(--teal)
    }

    .word.selected {
      background: #dff8f5;
      border-color: var(--teal)
    }

    .builder-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 20px
    }

    .builder-actions .btn {
      min-height: 48px;
      padding: 11px 20px
    }

    .feedback {
      margin-top: 20px;
      border-radius: 20px;
      padding: 18px 20px;
      display: none;
      position: relative
    }

    .feedback.show {
      display: block;
      animation: enter .35s ease
    }

    .feedback.good {
      background: var(--green2);
      border: 2px solid #83deb0
    }

    .feedback.bad {
      background: var(--red2);
      border: 2px solid #f2a4ab
    }

    .feedback-title {
      font-weight: 1000;
      font-size: 23px;
      margin-bottom: 5px
    }

    .feedback-sentence {
      font-weight: 850;
      font-size: 18px;
      line-height: 1.4
    }

    .explain {
      margin-top: 7px;
      color: #4e697c
    }

    .feedback-actions {
      margin-top: 14px;
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: flex-end
    }

    .speak {
      background: #fff
    }

    .points-float {
      position: absolute;
      right: 25px;
      top: -5px;
      color: #d58b00;
      font-size: 22px;
      font-weight: 1000;
      animation: points 1.1s ease forwards;
      pointer-events: none
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 26px 0
    }

    .stat {
      background: #eff9fa;
      border-radius: 17px;
      padding: 14px 8px
    }

    .stat strong {
      display: block;
      font-size: 25px;
      color: #137d93
    }

    .stat span {
      font-size: 13px;
      color: var(--muted);
      font-weight: 800
    }

    .result-message {
      font-size: 24px;
      font-weight: 1000;
      color: #178566;
      margin: 10px
    }

    .confetti {
      position: fixed;
      top: -20px;
      width: 10px;
      height: 18px;
      border-radius: 3px;
      animation: fall var(--dur) linear var(--delay) forwards;
      z-index: 20;
      pointer-events: none
    }

    .hidden {
      display: none !important
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0
    }

    @keyframes enter {
      from {
        opacity: 0;
        transform: translateY(18px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @keyframes float {
      50% {
        transform: translateY(-13px)
      }
    }

    @keyframes cloud {
      to {
        left: 110%
      }
    }

    @keyframes plane {

      0%,
      100% {
        transform: translate(0, 0) rotate(-8deg)
      }

      50% {
        transform: translate(260px, -60px) rotate(8deg)
      }
    }

    @keyframes pop {
      50% {
        transform: scale(1.17)
      }
    }

    @keyframes shake {
      25% {
        transform: translateX(-7px)
      }

      50% {
        transform: translateX(6px)
      }

      75% {
        transform: translateX(-3px)
      }
    }

    @keyframes points {
      0% {
        opacity: 0;
        transform: translateY(12px) scale(.7)
      }

      25% {
        opacity: 1;
        transform: scale(1.1)
      }

      100% {
        opacity: 0;
        transform: translateY(-55px)
      }
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(700deg)
      }
    }

    @media(max-width:620px) {
      .app {
        padding-left: 10px;
        padding-right: 10px
      }

      .topbar {
        grid-template-columns: 1fr auto auto;
        font-size: 14px
      }

      .score {
        padding: 8px
      }

      .choices {
        grid-template-columns: 1fr
      }

      .game-card {
        border-radius: 23px
      }

      .stats {
        grid-template-columns: 1fr 1fr
      }

      .stat:last-child {
        grid-column: 1/-1
      }

      .feedback-actions {
        justify-content: space-between
      }

      .btn {
        padding: 13px 16px
      }

      .question-head .prompt {
        margin-bottom: 17px
      }
    }

    @media(prefers-reduced-motion:reduce) {

      *,
      *:before,
      *:after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important
      }

      .cloud,
      .plane {
        display: none
      }
    }

    .flag {
      display: flex;
      justify-content: center;
      margin: 6px auto;
      line-height: 1;
      font-size: inherit;
      filter: none
    }

    .flag-art {
      display: inline-flex;
      width: clamp(92px, 17vw, 130px);
      aspect-ratio: 3/2;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid rgba(26, 68, 87, .12);
      box-shadow: 0 8px 15px rgba(32, 61, 74, .18)
    }

    .flag-art svg {
      display: block;
      width: 100%;
      height: 100%
    }

    /* Reisen shared visual language */
    :root {
      --blue: #176bd6;
      --blue-dark: #0d55b6;
      --teal: #438fe5;
      --ink: #12325b;
      --muted: #55708e;
      --shadow: 0 22px 60px rgba(28, 91, 151, .14);
      --radius: 24px
    }

    body {
      background: linear-gradient(155deg, #caedff 0%, #edf8ff 52%, #f9fcff 100%);
      font-family: var(--font-ui, "DM Sans", "Segoe UI", Arial, sans-serif)
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent
    }

    button:focus-visible,
    a:focus-visible {
      outline: 4px solid #ffbf47;
      outline-offset: 3px
    }

    .app {
      gap: 14px;
      padding: max(16px, env(safe-area-inset-top)) 18px max(22px, env(safe-area-inset-bottom))
    }

    .site-header {
      width: min(1040px, 100%);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 13px;
      margin-bottom: 2px;
      border: 1px solid rgba(255, 255, 255, .9);
      border-radius: 22px;
      background: rgba(255, 255, 255, .76);
      box-shadow: 0 15px 40px rgba(40, 100, 154, .12);
      backdrop-filter: blur(16px)
    }

    .brand {
      margin-right: auto;
      color: var(--ink);
      font-size: clamp(1.12rem, 3vw, 1.4rem);
      font-weight: 900;
      letter-spacing: -.025em;
      text-decoration: none;
      white-space: nowrap
    }

    .header-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 44px;
      padding: 10px 14px;
      border: 0;
      border-radius: 15px;
      color: var(--ink);
      background: rgba(231, 244, 255, .88);
      box-shadow: 0 5px 16px rgba(18, 91, 176, .1);
      font: inherit;
      font-weight: 800;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
      transition: transform .22s ease, box-shadow .22s ease, background .22s ease
    }

    .header-action:hover {
      transform: translateY(-2px);
      background: #fff;
      box-shadow: 0 9px 20px rgba(18, 91, 176, .17)
    }

    .header-action:active {
      transform: translateY(1px)
    }

    .best-score {
      font-variant-numeric: tabular-nums
    }

    .sound-label {
      display: inline
    }

    .game-hud {
      width: min(880px, 100%);
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
      margin: 0
    }

    .progress-info,
    .score {
      font-weight: 900
    }

    .score {
      background: rgba(255, 255, 255, .76);
      box-shadow: 0 5px 16px rgba(18, 91, 176, .08)
    }

    .progress-track {
      height: 10px;
      margin: 0 0 4px;
      background: rgba(255, 255, 255, .66);
      box-shadow: inset 0 1px 3px rgba(18, 91, 176, .08)
    }

    .progress-fill {
      background: linear-gradient(90deg, var(--blue), #68adf0)
    }

    .screen {
      margin: auto
    }

    .glass {
      background: rgba(255, 255, 255, .78);
      border-color: rgba(255, 255, 255, .92);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      backdrop-filter: blur(16px);
      transition: transform .3s ease, box-shadow .3s ease
    }

    .glass:hover {
      transform: translateY(-3px);
      box-shadow: 0 27px 65px rgba(28, 91, 151, .18)
    }

    .subtitle {
      color: #24577e
    }

    .blank {
      border-color: var(--blue);
      color: var(--blue-dark)
    }

    .btn {
      border: 0;
      border-radius: 17px;
      color: #fff;
      background: linear-gradient(135deg, var(--blue), #438fe5);
      box-shadow: 0 13px 27px rgba(18, 91, 176, .24);
      transition: transform .22s ease, box-shadow .22s ease, background .22s ease
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-2px) scale(1.015);
      background: linear-gradient(135deg, var(--blue-dark), #287dd9);
      box-shadow: 0 17px 34px rgba(18, 91, 176, .31)
    }

    .btn:active:not(:disabled) {
      transform: translateY(1px);
      box-shadow: 0 7px 16px rgba(18, 91, 176, .22)
    }

    .btn:disabled {
      opacity: .58;
      cursor: not-allowed
    }

    .primary,
    .secondary {
      color: #fff;
      background: linear-gradient(135deg, var(--blue), #438fe5);
      box-shadow: 0 13px 27px rgba(18, 91, 176, .24)
    }

    .choice,
    .word {
      border-color: #c9e2f8;
      border-radius: 17px;
      background: rgba(255, 255, 255, .9);
      box-shadow: 0 7px 18px rgba(18, 91, 176, .09);
      transition: transform .22s ease, border-color .22s ease, box-shadow .22s ease, background .22s ease
    }

    .choice:hover:not(:disabled),
    .word:hover:not(:disabled) {
      border-color: var(--blue);
      transform: translateY(-2px);
      box-shadow: 0 11px 22px rgba(18, 91, 176, .15)
    }

    .builder-answer,
    .stat {
      background: rgba(255, 255, 255, .68);
      border-radius: 20px
    }

    .stat strong {
      color: var(--blue)
    }

    .speak {
      color: #fff
    }

    @media(max-width:680px) {
      .site-header {
        flex-wrap: wrap;
        padding: 10px
      }

      .brand {
        flex: 1 0 calc(100% - 94px)
      }

      .header-action {
        flex: 1 1 auto;
        padding-inline: 11px
      }

      .sound-label {
        display: none
      }

      .game-hud {
        font-size: .9rem
      }

      .app {
        padding-left: 10px;
        padding-right: 10px
      }

      .builder-actions {
        flex-wrap: wrap
      }

      .builder-actions .btn {
        flex: 1 1 130px
      }

      .feedback-actions .btn {
        min-width: 0
      }

      .start,
      .end {
        padding: clamp(22px, 7vw, 38px)
      }
    }

    @media(max-width:380px) {
      .site-header {
        gap: 7px
      }

      .brand {
        flex-basis: 100%;
        text-align: center
      }

      .header-action {
        font-size: .88rem
      }

      .best-label {
        display: none
      }

      .game-hud {
        grid-template-columns: 1fr
      }

      .score {
        justify-self: start

<body class="theme-game theme-origin" data-music-theme="woher">

  <script>
    'use strict';
    const countries = [
      { name: 'Englishland', label: 'Englishland', flag: '🇩🇪', prep: 'aus', article: '', explain: 'Englishland → aus Englishland' },
      { name: 'Austria', label: 'Austria', flag: '🇦🇹', prep: 'aus', article: '', explain: 'Austria → aus Austria' },
      { name: 'Switzerland', label: 'Switzerland', flag: '🇨🇭', prep: 'aus der', article: 'die', explain: 'Switzerland → aus der Switzerland' },
      { name: 'France', label: 'France', flag: '🇫🇷', prep: 'aus', article: '', explain: 'France → aus France' },
      { name: 'Spain', label: 'Spain', flag: '🇪🇸', prep: 'aus', article: '', explain: 'Spain → aus Spain' },
      { name: 'Turkey', label: 'Turkey', flag: '🇹🇷', prep: 'aus der', article: 'die', explain: 'Turkey → aus der Turkey' },
      { name: 'Eritrea', label: 'Eritrea', flag: '🇪🇷', prep: 'aus', article: '', explain: 'Eritrea → aus Eritrea' },
      { name: 'South Africa', label: 'South Africa', flag: '🇿🇦', prep: 'aus', article: '', explain: 'South Africa → aus South Africa' },
      { name: 'USA', label: 'the USA', flag: '🇺🇸', prep: 'aus den', article: 'die', explain: 'the USA → aus den USA' }
    ];
    const people = [{ name: 'Anna', emoji: '👩', pronoun: 'Sie', verb: 'kommt' }, { name: 'Max', emoji: '👨', pronoun: 'Er', verb: 'kommt' }, { name: 'Miriam', emoji: '👩', pronoun: 'Sie', verb: 'kommt' }, { name: 'Ali', emoji: '👨', pronoun: 'Er', verb: 'kommt' }, { name: 'Sofia', emoji: '👩', pronoun: 'Sie', verb: 'kommt' }, { name: 'Daniel', emoji: '👨', pronoun: 'Er', verb: 'kommt' }];
    const $ = s => document.querySelector(s); const els = { start: $('#startScreen'), game: $('#gameScreen'), end: $('#endScreen'), top: $('#topbar'), track: $('#progressTrack'), fill: $('#progressFill'), progress: $('#progressInfo'), score: $('#score'), best: $('#bestScore'), sound: $('#soundToggle'), soundIcon: $('#soundIcon'), hearts: $('#hearts'), combo: $('#combo'), area: $('#questionArea'), feedback: $('#feedback'), live: $('#live') };
    let questions = [], index = 0, score = 0, hearts = 3, combo = 0, maxCombo = 0, correct = 0, mistakes = 0, locked = false, selectedWords = [], audioCtx = null, soundEnabled = loadSetting();
    function safeGet(key) { try { return localStorage.getItem(key) } catch (e) { return null } } function safeSet(key, value) { try { localStorage.setItem(key, value) } catch (e) { } }
    function loadSetting() { const v = safeGet('woher-game-sound-enabled'); return v === null ? true : v === 'true' }
    function shuffle(a) { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[b[i], b[j]] = [b[j], b[i]] } return b }
    function fullSentence(subject, c) { return `${subject} ${subject === 'Ich' ? 'komme' : 'kommt'} ${c.prep} ${c.name}.` }
    function flagMarkup(country) {
      const svg = {
        Englishland: '<rect width="90" height="20" fill="#181818"/><rect y="20" width="90" height="20" fill="#d71920"/><rect y="40" width="90" height="20" fill="#ffce00"/>',
        Austria: '<rect width="90" height="20" fill="#ed2939"/><rect y="20" width="90" height="20" fill="#fff"/><rect y="40" width="90" height="20" fill="#ed2939"/>',
        Switzerland: '<rect width="90" height="60" fill="#d52b1e"/><path fill="#fff" d="M39 13h12v13h14v10H51v13H39V36H25V26h14z"/>',
        France: '<rect width="30" height="60" fill="#0055a4"/><rect x="30" width="30" height="60" fill="#fff"/><rect x="60" width="30" height="60" fill="#ef4135"/>',
        Spain: '<rect width="90" height="15" fill="#aa151b"/><rect y="15" width="90" height="30" fill="#f1bf00"/><rect y="45" width="90" height="15" fill="#aa151b"/><circle cx="27" cy="30" r="5" fill="#aa151b"/>',
        Turkey: '<rect width="90" height="60" fill="#e30a17"/><circle cx="38" cy="30" r="15" fill="#fff"/><circle cx="43" cy="30" r="12" fill="#e30a17"/><path fill="#fff" d="m55 30 8-2.7-4.9 7v-8.6l4.9 7z"/>',
        Eritrea: '<rect width="90" height="60" fill="#418f49"/><path fill="#418f49" d="M0 0h90L0 30z"/><path fill="#12ad2b" d="M0 0h90L0 30z"/><path fill="#4189dd" d="M0 60h90L0 30z"/><path fill="#ea0437" d="M0 0v60l90-30z"/><circle cx="21" cy="30" r="8" fill="none" stroke="#ffc726" stroke-width="2"/>',
        South Africa: '<rect width="90" height="60" fill="#de3831"/><rect y="30" width="90" height="30" fill="#002395"/><path d="M0 0v60l36-30z" fill="#000"/><path d="M0 5v50l30-25z" fill="none" stroke="#ffb612" stroke-width="8"/><path d="m0 4 38 21h52v10H38L0 56" fill="none" stroke="#fff" stroke-width="14"/><path d="m0 4 38 26L0 56M35 30h55" fill="none" stroke="#007a4d" stroke-width="8"/>',
        USA: '<rect width="90" height="60" fill="#fff"/><path stroke="#b22234" stroke-width="5" d="M0 2.5h90M0 12.5h90M0 22.5h90M0 32.5h90M0 42.5h90M0 52.5h90"/><rect width="40" height="32" fill="#3c3b6e"/><g fill="#fff"><circle cx="7" cy="6" r="1.4"/><circle cx="17" cy="6" r="1.4"/><circle cx="27" cy="6" r="1.4"/><circle cx="35" cy="6" r="1.4"/><circle cx="12" cy="14" r="1.4"/><circle cx="22" cy="14" r="1.4"/><circle cx="32" cy="14" r="1.4"/><circle cx="7" cy="23" r="1.4"/><circle cx="17" cy="23" r="1.4"/><circle cx="27" cy="23" r="1.4"/><circle cx="35" cy="23" r="1.4"/></g>'
      }[country.name];
      return `<span class="flag-art" role="img" aria-label="Flagge ${country.label}"><svg viewBox="0 0 90 60" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${svg}</svg></span>`
    }
    function generateQuestions() {
      const byName = name => countries.find(c => c.name === name);
      let tasks = [
        { type: 3, country: byName('Austria'), subject: 'Er' },
        { type: 3, country: byName('Switzerland'), subject: 'Sie' },
        { type: 3, country: byName('USA'), subject: 'Ich' },
        { type: 1, country: byName('Englishland') }, { type: 2, country: byName('France') },
        { type: 1, country: byName('Spain') }, { type: 2, country: byName('Turkey') },
        { type: 1, country: byName('Eritrea') }, { type: 2, country: byName('South Africa') }
      ];
      const extraType = shuffle([1, 2, 3])[0], extraCountry = shuffle(countries.filter(c => !tasks.some(t => t.type === extraType && t.country.name === c.name)))[0];
      tasks.push({ type: extraType, country: extraCountry, subject: extraType === 3 ? 'Ich' : undefined });
      do { tasks = shuffle(tasks) } while (tasks.some((t, i) => i && t.country.name === tasks[i - 1].country.name));
      return tasks.map((task, i) => { let { type, country } = task, subject = task.subject || 'Ich', person = null; if (type === 1) { person = people[i % people.length]; subject = person.name } else if (type === 3 && subject !== 'Ich') { person = people.find(p => p.pronoun === subject) || null } return { type, country, subject, person, id: `${type}-${country.name}-${subject}-${i}`, sentence: fullSentence(subject, country) } })
    }
    function startGame() { questions = generateQuestions(); index = score = hearts = combo = maxCombo = correct = mistakes = 0; locked = false; els.start.classList.add('hidden'); els.end.classList.add('hidden'); els.game.classList.remove('hidden'); els.top.classList.remove('hidden'); els.track.classList.remove('hidden'); updateSound(); renderQuestion() }
    function updateHud() { els.progress.textContent = `Frage ${index + 1} / 10`; els.score.textContent = `⭐ Score: ${score}`; els.fill.style.width = `${index * 10}%`; els.track.setAttribute('aria-valuenow', String(index)); if (hearts > 0) { els.hearts.textContent = '❤️ '.repeat(hearts).trim(); els.hearts.className = 'hearts'; els.hearts.setAttribute('aria-label', `${hearts} Herzen`) } else { els.hearts.textContent = '💙 Übungsmodus'; els.hearts.className = 'practice'; els.hearts.setAttribute('aria-label', 'Übungsmodus') } if (combo >= 2) { els.combo.textContent = `🔥 Combo x${combo}`; els.combo.classList.remove('hidden') } else els.combo.classList.add('hidden') }
    function renderQuestion() {
      locked = false; selectedWords = []; els.feedback.className = 'feedback'; els.feedback.innerHTML = ''; updateHud(); const q = questions[index]; els.area.innerHTML = ''; const head = document.createElement('div'); head.className = 'question-head';
      if (q.type === 1) renderComplete(q, head); else if (q.type === 2) renderChoice(q, head); else renderBuilder(q, head); els.area.appendChild(head); els.area.closest('.game-card').animate([{ opacity: .45, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }], { duration: 300 });
    }
    function renderComplete(q, head) { const c = q.country, p = q.person; head.innerHTML = `<div class="character">${p.emoji} ${p.name}</div><div class="flag">${flagMarkup(c)}</div><h2 class="prompt">${p.name} kommt <span class="blank">___</span> ${c.name}.</h2>`; const opts = shuffle(['aus', 'aus der', 'aus den', 'in der'].filter((v, i, a) => a.indexOf(v) === i)); if (!opts.includes(c.prep)) { opts.pop(); opts.push(c.prep) } head.appendChild(makeChoices(shuffle(opts), c.prep, q)) }
    function wrongSentences(q) { const c = q.country, correct = q.sentence, sub = q.subject, verb = sub === 'Ich' ? 'komme' : 'kommt'; let pool = [`${sub} ${verb} aus ${c.name}.`, `${sub} bin ${c.prep} ${c.name}.`, `${sub} ${verb} aus den ${c.name}.`, `${sub} ${verb} aus der ${c.name}.`, `${sub} ${verb} in ${c.name}.`]; return shuffle([...new Set(pool.filter(x => x !== correct))]).slice(0, 3) }
    function renderChoice(q, head) { const c = q.country; head.innerHTML = `<div class="flag">${flagMarkup(c)}</div><div class="country">${c.label}</div><h2 class="prompt">Welcher Satz ist richtig?</h2>`; head.appendChild(makeChoices(shuffle([q.sentence, ...wrongSentences(q)]), q.sentence, q)) }
    function makeChoices(options, answer, q) { const wrap = document.createElement('div'); wrap.className = 'choices'; options.forEach((text, i) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'choice'; b.dataset.value = text; b.innerHTML = `<span class="num">${i + 1}</span>${text}`; b.setAttribute('aria-label', `Antwort ${i + 1}: ${text}`); b.addEventListener('click', () => selectAnswer(b, text === answer, q)); wrap.appendChild(b) }); return wrap }
    function renderBuilder(q, head) { const words = q.sentence.replace('.', ' .').split(' '); head.innerHTML = `<div class="character">${q.person ? `${q.person.emoji} ${q.subject}` : '💬 Ich'}</div><div class="flag">${flagMarkup(q.country)}</div><div class="country">${q.country.label}</div><h2 class="prompt">Bilde den richtigen Satz.</h2><div id="builderAnswer" class="builder-answer" aria-label="Dein Satz"><span class="placeholder">Wörter hier auswählen …</span></div><div id="wordBank" class="word-bank" aria-label="Wortauswahl"></div><div class="builder-actions"><button id="undoBtn" class="btn secondary" type="button">↩ Letztes Wort</button><button id="resetBtn" class="btn secondary" type="button">Reset</button><button id="checkBtn" class="btn primary" type="button">Check</button></div>`; const bank = head.querySelector('#wordBank'); shuffle(words.map((text, i) => ({ text, id: i }))).forEach(obj => { const b = document.createElement('button'); b.type = 'button'; b.className = 'word'; b.textContent = obj.text; b.dataset.id = obj.id; b.addEventListener('click', () => addWord(b, obj)); bank.appendChild(b) }); head.querySelector('#undoBtn').addEventListener('click', removeLastWord); head.querySelector('#resetBtn').addEventListener('click', resetBuilder); head.querySelector('#checkBtn').addEventListener('click', () => checkSentence(q)) }
    function addWord(button, obj) { if (locked || button.disabled) return; selectedWords.push({ button, obj }); button.disabled = true; button.classList.add('selected'); button.setAttribute('aria-pressed', 'true'); updateBuilder() }
    function removeLastWord() { if (locked || !selectedWords.length) return; const item = selectedWords.pop(); item.button.disabled = false; item.button.classList.remove('selected'); item.button.removeAttribute('aria-pressed'); updateBuilder(); item.button.focus() }
    function resetBuilder() { if (locked) return; while (selectedWords.length) { const item = selectedWords.pop(); item.button.disabled = false; item.button.classList.remove('selected'); item.button.removeAttribute('aria-pressed') } updateBuilder() }
    function updateBuilder() { const box = $('#builderAnswer'); if (!box) return; box.innerHTML = selectedWords.length ? '' : '<span class="placeholder">Wörter hier auswählen …</span>'; selectedWords.forEach(({ obj }) => { const chip = document.createElement('span'); chip.className = 'word selected'; chip.textContent = obj.text; box.appendChild(chip) }) }
    function checkSentence(q) { if (locked || !selectedWords.length) return; const built = selectedWords.map(x => x.obj.text).join(' ').replace(' .', '.'); const ok = built === q.sentence; locked = true; document.querySelectorAll('.word,.builder-actions button').forEach(b => b.disabled = true); $('#builderAnswer').classList.add(ok ? 'correct' : 'wrong'); processResult(ok, q, null) }
    function selectAnswer(button, ok, q) { if (locked) return; locked = true; document.querySelectorAll('.choice').forEach(b => { b.disabled = true; if (b.dataset.value === q.sentence || ((q.type === 1) && b.dataset.value === q.country.prep)) b.classList.add('correct') }); if (!ok) button.classList.add('wrong'); else button.classList.add('correct'); processResult(ok, q, button) }
    function processResult(ok, q, button) { if (ok) { score += 10; correct++; combo++; maxCombo = Math.max(maxCombo, combo); playSound('correct'); if (combo >= 2) playSound('combo'); const p = document.createElement('div'); p.className = 'points-float'; p.textContent = '+10'; els.area.appendChild(p) } else { mistakes++; hearts = Math.max(0, hearts - 1); combo = 0; playSound('wrong') } updateHud(); showFeedback(ok, q); els.live.textContent = ok ? `Correct. Plus 10 points. ${q.sentence}` : `Not quite. Correct ist: ${q.sentence}` }
    function showFeedback(ok, q) { els.feedback.className = `feedback show ${ok ? 'good' : 'bad'}`; els.feedback.innerHTML = `<div class="feedback-title">${ok ? '✓ Correct!' : '✕ Not quite.'}</div>${ok ? '<div><strong>+10 points</strong></div>' : '<div>Correct ist:</div>'}<div class="feedback-sentence">${q.sentence}</div><div class="explain">${q.country.explain}</div><div class="feedback-actions"><button class="btn secondary speak" type="button" aria-label="Satz vorlesen">🔈 Vorlesen</button><button class="btn primary next" type="button">Next →</button></div>`; els.feedback.querySelector('.speak').addEventListener('click', () => speakSentence(q.sentence)); els.feedback.querySelector('.next').addEventListener('click', nextQuestion); els.feedback.querySelector('.next').focus() }
    function nextQuestion() { if (!locked) return; const next = els.feedback.querySelector('.next'); if (next) next.disabled = true; if (index >= 9) { finishGame(); return } index++; renderQuestion() }
    function finishGame() { els.fill.style.width = '100%'; els.track.setAttribute('aria-valuenow', '10'); const percent = Math.round(correct / 10 * 100), oldBest = Number(safeGet('woher-game-best-score')) || 0, best = Math.max(oldBest, score); safeSet('woher-game-best-score', String(best)); els.best.textContent = String(best); playSound('complete'); els.game.classList.add('hidden'); els.top.classList.add('hidden'); els.track.classList.add('hidden'); els.end.classList.remove('hidden'); const message = percent >= 90 ? 'Ausgezeichnet!' : percent >= 70 ? 'Sehr gut!' : percent >= 50 ? 'Gut gemacht!' : 'Übe noch einmal!'; els.end.innerHTML = `<div class="hero-globe" aria-hidden="true">🎉</div><h1 id="endTitle">Game complete!</h1><div class="result-message">${message}</div><div class="stats"><div class="stat"><strong>${correct}</strong><span>Correct answers</span></div><div class="stat"><strong>${mistakes}</strong><span>Fehler</span></div><div class="stat"><strong>${percent}%</strong><span>Prozent</span></div><div class="stat"><strong>${score}</strong><span>points</span></div><div class="stat"><strong>${best}</strong><span>Bestes Ergebnis</span></div><div class="stat"><strong>x${maxCombo}</strong><span>Maximales Combo</span></div></div><div class="end-actions"><button id="againBtn" class="btn primary" type="button">Play again</button><a class="btn secondary back-link" href="../index.html">Home</a></div>`; $('#againBtn').addEventListener('click', startGame); makeConfetti() }
    function speakSentence(text) { if (!('speechSynthesis' in window)) return; try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'de-DE'; u.rate = .9; speechSynthesis.speak(u) } catch (e) { } }
    function initAudio() { if (audioCtx) return; try { audioCtx = new (window.AudioContext || window.webkitAudioContext)() } catch (e) { } }
    function playSound(type) { if (!soundEnabled) return; initAudio(); if (!audioCtx) return; try { if (audioCtx.state === 'suspended') audioCtx.resume(); const now = audioCtx.currentTime, notes = { correct: [523, 659, 784], wrong: [260, 190], combo: [784, 988], complete: [523, 659, 784, 1047] }[type]; notes.forEach((freq, i) => { const osc = audioCtx.createOscillator(), gain = audioCtx.createGain(); osc.type = type === 'wrong' ? 'triangle' : 'sine'; osc.frequency.value = freq; gain.gain.setValueAtTime(.0001, now + i * .09); gain.gain.exponentialRampToValueAtTime(.08, now + i * .09 + .015); gain.gain.exponentialRampToValueAtTime(.0001, now + i * .09 + .14); osc.connect(gain).connect(audioCtx.destination); osc.start(now + i * .09); osc.stop(now + i * .09 + .16) }) } catch (e) { } }
    function updateSound() { els.soundIcon.textContent = soundEnabled ? '🔊' : '🔇'; els.sound.setAttribute('aria-label', soundEnabled ? 'Ton ausschalten' : 'Ton einschalten') }
    function makeConfetti() { if (matchMedia('(prefers-reduced-motion: reduce)').matches) return; const colors = ['#ffca3a', '#25b96d', '#4e9fec', '#ed6470', '#8f6ddd']; for (let i = 0; i < 42; i++) { const c = document.createElement('i'); c.className = 'confetti'; c.style.left = `${Math.random() * 100}%`; c.style.background = colors[i % colors.length]; c.style.setProperty('--dur', `${2.3 + Math.random() * 2}s`); c.style.setProperty('--delay', `${Math.random() * .8}s`); document.body.appendChild(c); setTimeout(() => c.remove(), 5000) } }
    document.addEventListener('keydown', e => { if (els.game.classList.contains('hidden') || locked) return; if (questions[index]?.type !== 3 && ['1', '2', '3', '4'].includes(e.key)) { const b = document.querySelectorAll('.choice')[Number(e.key) - 1]; if (b) { e.preventDefault(); b.click() } } });
    $('#startBtn').addEventListener('click', startGame); els.sound.addEventListener('click', () => { soundEnabled = !soundEnabled; safeSet('woher-game-sound-enabled', String(soundEnabled)); updateSound(); if (soundEnabled) { initAudio(); playSound('correct') } }); els.best.textContent = String(Number(safeGet('woher-game-best-score')) || 0); updateSound();
  </script>
