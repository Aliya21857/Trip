  function load(k,f){try{const v=localStorage.getItem(k);return v===null?f:JSON.parse(v)}catch{return f}} function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
  function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
  function generateSession(){const byType={statement:shuffle(tasks.filter(t=>t.type==='statement')),question:shuffle(tasks.filter(t=>t.type==='question')),dialogue:shuffle(tasks.filter(t=>t.type==='dialogue'))};let out=[],types=shuffle(['statement','question','dialogue','statement','question','dialogue','statement','question','dialogue','statement']);types.forEach(type=>{let pool=byType[type];let pick=pool.find(t=>!out.some(o=>o.correctSentence===t.correctSentence));if(pick){out.push(pick);byType[type]=pool.filter(t=>t!==pick)}});return out}
  function startGame(){session=generateSession();index=score=hearts=combo=maxCombo=correct=errors=hints=0;els.start.classList.add('hidden');els.end.classList.add('hidden');els.game.classList.remove('hidden');renderQuestion()}
  function renderQuestion(){selected=[];hintUsed=checked=nextLocked=false;startedAt=performance.now();const t=session[index];els.progressLabel.textContent=`Frage ${index+1} / 10`;els.progressFill.style.width=`${(index+1)*10}%`;els.type.textContent={statement:'Aussage',question:'Frage',dialogue:'Mini-Dialog'}[t.type];els.prompt.textContent=t.prompt;els.dialogue.textContent=t.dialogueLine||'';els.dialogue.classList.toggle('hidden',!t.dialogueLine);els.feedback.textContent='';els.feedback.className='feedback';els.answer.className='answer empty';els.next.classList.add('hidden');els.check.classList.remove('hidden');els.hint.disabled=false;els.hint.textContent='💡 Tipp';setInteraction(true);renderWordCards();updateStats();els.play.style.animation='none';requestAnimationFrame(()=>els.play.style.animation='enter .4s ease both')}
  function renderWordCards(){const t=session[index];els.answer.replaceChildren();els.pool.replaceChildren();els.answer.classList.toggle('empty',selected.length===0);selected.forEach(item=>els.answer.append(makeWord(item,true)));t.words.map((word,i)=>({word,i})).filter(item=>!selected.some(s=>s.i===item.i)).forEach(item=>els.pool.append(makeWord(item,false)));els.announce.textContent=selected.length?'Ausgewählt: '+format(selected.map(s=>s.word)):'Keine Wörter ausgewählt.'}
  function makeWord(item,isSelected){const b=document.createElement('button');b.className='word';b.type='button';b.textContent=item.word;b.dataset.index=item.i;b.disabled=checked;b.setAttribute('aria-label',(isSelected?'Wort entfernen: ':'Wort auswählen: ')+item.word);b.addEventListener('click',()=>isSelected?removeWord(item.i):selectWord(item.i));return b}
  function selectWord(i){if(checked||selected.some(x=>x.i===i))return;selected.push({word:session[index].words[i],i});playSound('select');renderWordCards()}
  function removeWord(i){if(checked)return;selected=selected.filter(x=>x.i!==i);playSound('remove');renderWordCards()}
  function undoLastWord(){if(checked||!selected.length)return;selected.pop();playSound('remove');renderWordCards()}
  function resetSentence(){if(checked)return;selected=[];playSound('remove');renderWordCards()}
  function useHint(){if(checked||hintUsed)return;hintUsed=true;hints++;const first=firstWord(session[index].correctSentence);els.hint.disabled=true;els.hint.textContent='💡 Tipp benutzt';els.feedback.className='feedback';els.feedback.innerHTML=`<span class="bonus">Das erste Wort ist: ${escapeHtml(first)}</span>`;els.announce.textContent=`Tipp: Das erste Wort ist ${first}`;playSound('hint')}
  function firstWord(s){return s.match(/^\S+/)[0].replace(/[.,!?]$/,'')} function format(words){return words.join(' ').replace(/\s+([.,!?])/g,'$1').replace(/\s+/g,' ').trim()}
  function checkAnswer(){if(checked||!selected.length)return;checked=true;const t=session[index],answer=format(selected.map(x=>x.word)),ok=answer===t.correctSentence;setInteraction(false);els.check.classList.add('hidden');els.next.classList.remove('hidden');els.answer.classList.remove('empty');if(ok){correct++;combo++;maxCombo=Math.max(maxCombo,combo);let gained=hintUsed?5:10;const fast=performance.now()-startedAt<=8000;if(fast)gained+=5;score+=gained;els.answer.classList.add('correct');els.feedback.className='feedback good';els.feedback.innerHTML=`<span class="feedback-title">✓ Richtig!</span><span>+${hintUsed?5:10} Punkte${fast?' · <b>+5 Bonus</b>':''}</span><span class="correct-line">${escapeHtml(t.correctSentence)}</span>`;floatPoints(gained);playSound('correct');if(combo>=3){playSound('combo');showSeries()}}else{errors++;combo=0;hearts=Math.max(0,hearts-1);els.answer.classList.add('wrong');els.feedback.className='feedback bad';els.feedback.innerHTML=`<span class="feedback-title">Leider falsch.</span><span>Richtig ist:</span><span class="correct-line">${escapeHtml(t.correctSentence)}</span>`;playSound('wrong')}updateStats();speakText(t.speechText||t.correctSentence)}
  function setInteraction(on){els.undo.disabled=els.reset.disabled=!on;els.check.disabled=!on;els.pool.querySelectorAll('button').forEach(b=>b.disabled=!on);els.answer.querySelectorAll('button').forEach(b=>b.disabled=!on)}
  function updateStats(){els.score.textContent=`⭐ Score: ${score}`;els.hearts.textContent=hearts?`${'❤️ '.repeat(hearts).trim()}${'♡ '.repeat(3-hearts).trim()}`:'💙 Übungsmodus';els.combo.textContent=combo>=2?`🔥 Combo x${combo}`:''}
  function nextQuestion(){if(!checked||nextLocked)return;nextLocked=true;if(index<9){index++;renderQuestion()}else finishGame()}
  function finishGame(){els.game.classList.add('hidden');els.end.classList.remove('hidden');const pct=Math.round(correct/10*100),best=Math.max(score,load('satz-puzzle-best-score',0));save('satz-puzzle-best-score',best);$('headerBestScore').textContent=best;$('resultMessage').textContent=pct>=90?'Ausgezeichnet!':pct>=70?'Sehr gut!':pct>=50?'Gut gemacht!':'Übe noch einmal!';const data=[['Richtige Sätze',correct],['Fehler',errors],['Prozent',pct+'%'],['Punkte',score],['Bestes Ergebnis',best],['Maximales Combo','x'+maxCombo],['Verwendete Tipps',hints]];$('results').innerHTML=data.map(([a,b])=>`<div class="result">${a}<b>${b}</b></div>`).join('');confetti();playSound('complete')}
  function speakText(text){if(!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='de-DE';u.rate=.9;speechSynthesis.speak(u)}catch{}}
  function playSound(type){if(!soundEnabled)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const map={select:[520,.05],remove:[330,.05],correct:[660,.18],wrong:[190,.22],combo:[880,.25],hint:[740,.12],complete:[550,.45]},[freq,dur]=map[type];const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type==='wrong'?'sawtooth':'sine';o.frequency.setValueAtTime(freq,audioCtx.currentTime);if(type==='correct'||type==='complete')o.frequency.exponentialRampToValueAtTime(freq*1.5,audioCtx.currentTime+dur);g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.13,audioCtx.currentTime+.015);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur)}catch{}}
  function toggleSound(){soundEnabled=!soundEnabled;save('satz-puzzle-sound-enabled',soundEnabled);els.sound.textContent=soundEnabled?'🔊 Sound':'🔇 Sound';els.sound.setAttribute('aria-label',soundEnabled?'Ton ausschalten':'Ton einschalten');if(soundEnabled)playSound('select')}
  function showSeries(){const d=document.createElement('div');d.className='series';d.textContent='🔥 Super Serie!';document.body.append(d);setTimeout(()=>d.remove(),1600)} function floatPoints(n){const d=document.createElement('span');d.className='points-fly';d.textContent=`+${n}`;els.play.append(d);setTimeout(()=>d.remove(),1200)}
  function confetti(){const colors=['#6da8ff','#8169e8','#ffcb4c','#ff7c76','#42c693'];for(let i=0;i<45;i++){const c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=colors[i%colors.length];c.style.animationDelay=Math.random()*.8+'s';c.style.transform=`rotate(${Math.random()*180}deg)`;document.body.append(c);setTimeout(()=>c.remove(),3600)}}
  function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  $('startBtn').addEventListener('click',startGame);$('againBtn').addEventListener('click',startGame);els.undo.addEventListener('click',undoLastWord);els.reset.addEventListener('click',resetSentence);els.hint.addEventListener('click',useHint);els.check.addEventListener('click',checkAnswer);els.next.addEventListener('click',nextQuestion);els.sound.addEventListener('click',toggleSound);$('speakBtn').addEventListener('click',()=>{const t=session[index];speakText(checked?t.correctSentence:(t.dialogueLine||t.correctSentence))});
  document.addEventListener('keydown',e=>{if(els.game.classList.contains('hidden'))return;if(!checked&&/^([1-9])$/.test(e.key)){const b=els.pool.querySelectorAll('.word')[Number(e.key)-1];if(b){e.preventDefault();b.click()}}if(e.key==='ArrowLeft'&&!checked)undoLastWord();if(e.key==='ArrowRight'&&checked)nextQuestion()});$('headerBestScore').textContent=load('satz-puzzle-best-score',0);els.sound.textContent=soundEnabled?'🔊 Sound':'🔇 Sound';els.sound.setAttribute('aria-label',soundEnabled?'Ton ausschalten':'Ton einschalten');
  </script>
</body>
